# Lints every shell script and runs the tests.
#
# Why: sync.sh rewrites the live settings.json of every config dir, and
# guard-bash.sh is a safety control. Both were once broken with nothing to
# notice it (the guards never fired for months, see #91). The skill script
# tests existed but ran nowhere.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: shellcheck
        run: git ls-files -z '*.sh' project-init | xargs -0 shellcheck -x -S warning

      - name: ruff
        run: |
          pip install --quiet 'ruff==0.17.6'
          git ls-files -z '*.py' | xargs -0 ruff check

      - name: Script and hook tests
        run: python3 -m unittest discover -s tests -v

      - name: Skill script tests
        run: |
          # Each skill's tests import the scripts next to them, so they run
          # from their own directory.
          dirs="$(git ls-files | grep -E '^\.claude/skills/.+/test_[^/]+\.py$' | xargs -n1 dirname | sort -u)"
          if [ -z "${dirs}" ]; then
            echo 'No skill tests found -- has the layout changed?'
            exit 1
          fi
          status=0
          for dir in ${dirs}; do
            echo "::group::${dir}"
            (cd "${dir}" && python3 -m unittest discover -p 'test_*.py') || status=1
            echo "::endgroup::"
          done
          exit "${status}"

  # The scripts claim to run on stock macOS bash 3.2, and the tests start them
  # through `bash` from PATH. A shim dir with /bin/bash first on PATH makes every
  # test exercise bash 3.2 and the BSD tools (sed, rsync) without rewriting them.
  tests-macos:
    name: Tests (macOS, bash 3.2)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The runner's /usr/bin/python3 is 3.9; the tests need 3.10+.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Put /bin/bash first on PATH
        run: |
          mkdir -p "${RUNNER_TEMP}/bash32"
          ln -s /bin/bash "${RUNNER_TEMP}/bash32/bash"
          echo "${RUNNER_TEMP}/bash32" >> "${GITHUB_PATH}"

      - name: Check the shell under test is bash 3.2
        run: |
          bash --version
          bash --version | head -1 | grep -q 'version 3\.2'

      - name: Script and hook tests
        run: python3 -m unittest discover -s tests -v

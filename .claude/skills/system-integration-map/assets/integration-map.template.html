const GOOD_TO_KNOW = [
  "Replace these with surprises the mapping turned up: installed-but-unused SDKs, single channels everything depends on, infra that differs between environments.",
];
// ── END DATA ──

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("svg");
const panel = document.getElementById("panel");
const flowsEl = document.getElementById("flows");
let view = "context";
let sel = null;

function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function nodeById(id) { return VIEWS[view].nodes.find(n => n.id === id); }
function edgeById(id) { return VIEWS[view].edges.find(e => e.id === id); }

function exitPoint(n, from, to) {
  const dx = to.x - from.x, dy = to.y - from.y;
  let t = Infinity;
  if (dx > 0) t = Math.min(t, (n.x + n.w - from.x) / dx);
  if (dx < 0) t = Math.min(t, (n.x - from.x) / dx);
  if (dy > 0) t = Math.min(t, (n.y + n.h - from.y) / dy);
  if (dy < 0) t = Math.min(t, (n.y - from.y) / dy);
  return { x: from.x + dx * t, y: from.y + dy * t };
}

function drawMarkers() {
  const defs = el("defs", {}, svg);
  for (const k of Object.keys(KINDS)) {
    const m = el("marker", { id: `mk-${k}`, viewBox: "0 0 10 10", refX: "9", refY: "5", markerWidth: "7", markerHeight: "7", orient: "auto-start-reverse" }, defs);
    el("path", { d: "M0,0 L10,5 L0,10 z", class: `mk-${k}` }, m);
  }
}

function drawNode(n) {
  const g = el("g", { class: `node ${n.kind}${n.major ? " major" : ""}`, "data-id": n.id, tabindex: "0", role: "button", "aria-label": `${n.label}: ${n.sub}` }, svg);
  el("rect", { class: "box", x: n.x, y: n.y, width: n.w, height: n.h, rx: n.kind === "person" ? 32 : 10 }, g);
  const pad = 14;
  const center = !n.lines && !n.cta;
  const tx = center ? n.x + n.w / 2 : n.x + pad;
  const anchor = center ? "middle" : "start";
  let y = center ? n.y + n.h / 2 - 2 : n.y + 26;
  const t = el("text", { class: "t", x: tx, y, "text-anchor": anchor }, g); t.textContent = n.label;
  y += 17;
  const s = el("text", { class: "s", x: tx, y, "text-anchor": anchor }, g); s.textContent = n.sub;
  if (n.lines) {
    y += 10;
    for (const line of n.lines) {
      y += 18;
      const l = el("text", { class: `li${n.codeLines ? " code" : ""}`, x: tx, y }, g); l.textContent = (n.codeLines ? "▸ " : "· ") + line;
    }
  }
  if (n.cta) {
    const c = el("g", { class: "cta" }, g);
    el("rect", { x: n.x + pad, y: n.y + n.h - 40, width: 118, height: 26, rx: 13 }, c);
    const ct = el("text", { x: n.x + pad + 59, y: n.y + n.h - 23, "text-anchor": "middle" }, c); ct.textContent = n.cta;
  }
  const activate = () => {
    if (n.drill && sel && sel.type === "node" && sel.id === n.id) return setView(n.drill);
    select({ type: "node", id: n.id });
  };
  g.addEventListener("click", activate);
  g.addEventListener("dblclick", () => { if (n.drill) setView(n.drill); else if (n.up) setView("context", n.up); });
  g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activate(); } });
}

function drawEdge(e) {
  const a = nodeById(e.from), b = nodeById(e.to);
  const ca = { x: a.x + a.w / 2, y: a.y + a.h / 2 }, cb = { x: b.x + b.w / 2, y: b.y + b.h / 2 };
  const dx = cb.x - ca.x, dy = cb.y - ca.y, len = Math.hypot(dx, dy);
  const px = -dy / len, py = dx / len, off = e.off || 0;
  const sa = { x: ca.x + px * off, y: ca.y + py * off }, sb = { x: cb.x + px * off, y: cb.y + py * off };
  const p1 = exitPoint(a, sa, sb), p2 = exitPoint(b, sb, sa);
  const ux = dx / len, uy = dy / len, gap = 3;
  const s = { x: p1.x + ux * gap, y: p1.y + uy * gap }, f = { x: p2.x - ux * gap, y: p2.y - uy * gap };
  const g = el("g", { class: `edge ${e.kind}`, "data-id": e.id, tabindex: "0", role: "button", "aria-label": `${e.label}, from ${a.label} to ${b.label}` });
  svg.insertBefore(g, svg.querySelector(".node"));
  const d = `M${s.x},${s.y} L${f.x},${f.y}`;
  el("path", { class: "hit", d }, g);
  const ln = el("path", { class: "ln", d, "marker-end": `url(#mk-${e.kind})` }, g);
  if (e.both) ln.setAttribute("marker-start", `url(#mk-${e.kind})`);
  const t = e.t ?? 0.5;
  const mx = s.x + (f.x - s.x) * t, my = s.y + (f.y - s.y) * t;
  const pill = el("g", { class: "pill" }, g);
  const r = el("rect", { rx: 9, height: 20 }, pill);
  const tx = el("text", { x: mx, y: my + 4, "text-anchor": "middle" }, pill); tx.textContent = e.label;
  const w = tx.getComputedTextLength() + 16;
  r.setAttribute("x", mx - w / 2); r.setAttribute("y", my - 10); r.setAttribute("width", w);
  const activate = () => select({ type: "edge", id: e.id });
  g.addEventListener("click", activate);
  g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); activate(); } });
}

function render() {
  const v = VIEWS[view];
  svg.innerHTML = "";
  svg.setAttribute("viewBox", v.viewBox);
  drawMarkers();
  v.nodes.forEach(drawNode);
  v.edges.forEach(drawEdge);
  document.getElementById("hint").textContent = v.hint;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === view)));
  const crumbs = document.getElementById("crumbs");
  crumbs.innerHTML = view === "context"
    ? `<span>System context: ${esc(SYSTEM_NAME)} and everything it talks to</span>`
    : `<button type="button" id="crumb-up">System context</button><span>›</span><span>Inside ${esc(SYSTEM_NAME)}</span>`;
  const up = document.getElementById("crumb-up");
  if (up) up.addEventListener("click", () => setView("context"));
  flowsEl.hidden = !v.flows;
  flowsEl.innerHTML = "";
  if (v.flows) {
    const lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = "Trace a flow"; flowsEl.appendChild(lbl);
    for (const f of v.flows) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = f.label; b.dataset.flow = f.id; b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", () => select(sel && sel.type === "flow" && sel.id === f.id ? null : { type: "flow", id: f.id }));
      flowsEl.appendChild(b);
    }
  }
  applySelection();
}

function applySelection() {
  svg.classList.toggle("has-sel", !!sel);
  svg.classList.toggle("flowing", !!sel && sel.type === "flow");
  svg.querySelectorAll(".on").forEach(n => n.classList.remove("on"));
  flowsEl.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(!!sel && sel.type === "flow" && c.dataset.flow === sel.id)));
  if (sel) {
    let edgeIds = [], nodeIds = [];
    if (sel.type === "node") {
      nodeIds = [sel.id];
      VIEWS[view].edges.forEach(e => { if (e.from === sel.id || e.to === sel.id) { edgeIds.push(e.id); nodeIds.push(e.from, e.to); } });
    } else if (sel.type === "edge") {
      const e = edgeById(sel.id); edgeIds = [e.id]; nodeIds = [e.from, e.to];
    } else {
      const f = VIEWS[view].flows.find(x => x.id === sel.id);
      edgeIds = f.edges;
      f.edges.forEach(id => { const e = edgeById(id); nodeIds.push(e.from, e.to); });
    }
    edgeIds.forEach(id => svg.querySelector(`.edge[data-id="${id}"]`)?.classList.add("on"));
    nodeIds.forEach(id => svg.querySelector(`.node[data-id="${id}"]`)?.classList.add("on"));
  }
  renderPanel();
}

function select(s) { sel = s; applySelection(); }

function setView(v, focusId) {
  view = v; sel = focusId ? { type: "node", id: focusId } : null;
  try { history.replaceState(null, "", v === "inside" ? "#inside" : "#context"); } catch (_) {}
  render();
}

function codeList(items) {
  if (!items || !items.length) return "";
  return `<ul class="code-list">${items.map(c => {
    const p = typeof c === "string" ? c : c.p; const n = typeof c === "string" ? "" : c.n;
    return `<li><a href="${gh(p)}" target="_blank" rel="noopener">${esc(p)}</a>${n ? `<span class="why">${esc(n)}</span>` : ""}</li>`;
  }).join("")}</ul>`;
}
function unverifiedBlock(list) {
  if (!list || !list.length) return "";
  return `<section><h3>Open questions</h3><ul>${list.map(u => `<li><span class="tag">UNVERIFIED</span> ${esc(u)}</li>`).join("")}</ul></section>`;
}
function swatch(kind) { return `<span class="sw" style="color: var(--k-${kind})"></span>`; }

function renderPanel() {
  const v = VIEWS[view];
  let h = "";
  if (!sel) {
    const it = v.intro;
    h = `<div class="eyebrow">${esc(it.eyebrow)}</div>
      <h2>${esc(it.title)}</h2>
      ${it.paras.map(p => `<p>${esc(p)}</p>`).join("")}
      ${it.start ? `<section><h3>Start here</h3><ul class="linklist">${it.start.map(id => edgeLink(edgeById(id))).join("")}</ul></section>` : ""}
      ${v.flows ? `<section><h3>Trace a flow</h3><ul class="linklist">${v.flows.map(f => `<li><button type="button" data-flow="${f.id}"><span class="k" style="background: var(--accent)"></span>${esc(f.title)}</button></li>`).join("")}</ul></section>` : ""}
      ${view === "context" ? `<button class="btn" type="button" id="go-inside">Look inside ${esc(SYSTEM_NAME)} →</button>` : ""}`;
  } else if (sel.type === "node") {
    const n = nodeById(sel.id);
    const conns = v.edges.filter(e => e.from === n.id || e.to === n.id);
    h = `<div class="eyebrow">${n.kind === "self" || n.kind === "ours" ? `Part of ${esc(SYSTEM_NAME)}` : n.kind === "person" ? "People" : "External system"}</div>
      <h2>${esc(n.label)}</h2>
      ${(n.desc || []).map(p => `<p>${esc(p)}</p>`).join("")}
      ${n.drill ? '<button class="btn" type="button" id="go-inside">Look inside →</button>' : ""}
      ${n.up ? `<button class="btn" type="button" data-up="${n.up}">Show in System context</button>` : ""}
      ${n.modules ? `<section><h3>Modules</h3><table class="mini">${n.modules.map(([m, d]) => `<tr><td>${esc(m)}</td><td>${esc(d)}</td></tr>`).join("")}</table></section>` : ""}
      ${n.crons ? `<section><h3>Schedules</h3><table class="mini">${n.crons.map(([m, d]) => `<tr><td>${esc(m)}</td><td>${esc(d)}</td></tr>`).join("")}</table></section>` : ""}
      ${n.routes ? `<section><h3>Main routes</h3><p>${n.routes.map(esc).join(" · ")}</p></section>` : ""}
      ${conns.length ? `<section><h3>Connections</h3><ul class="linklist">${conns.map(edgeLink).join("")}</ul></section>` : ""}
      ${n.code && n.code.length ? `<section><h3>Code</h3>${codeList(n.code)}</section>` : ""}
      ${unverifiedBlock(n.unverified)}`;
  } else if (sel.type === "edge") {
    const e = edgeById(sel.id), a = nodeById(e.from), b = nodeById(e.to);
    h = `<div class="eyebrow">${swatch(e.kind)}${esc(KINDS[e.kind])}</div>
      <h2>${esc(e.label)}</h2>
      <div class="dir"><span>${esc(a.label)}</span><span class="arrow">${e.both ? "⇄" : "→"}</span><span>${esc(b.label)}</span></div>
      <dl class="kv"><dt>How</dt><dd>${esc(e.mech)}</dd><dt>What flows</dt><dd>${esc(e.flows)}</dd><dt>Runs in</dt><dd>${esc(e.runs)}</dd></dl>
      ${e.warn ? `<div class="note"><strong>Heads up.</strong> ${esc(e.warn)}</div>` : ""}
      ${e.code ? `<section><h3>Code</h3>${codeList(e.code)}</section>` : ""}
      ${unverifiedBlock(e.unverified)}`;
  } else {
    const f = v.flows.find(x => x.id === sel.id);
    h = `<div class="eyebrow">Flow</div><h2>${esc(f.title)}</h2>
      <ol class="steps">${f.steps.map(s => `<li><div>${esc(s.t)}${codeList(s.c)}</div></li>`).join("")}</ol>`;
  }
  h += sel ? '<button class="chip" type="button" id="clear">Clear selection</button>' : "";
  panel.innerHTML = h;
  panel.querySelector("#go-inside")?.addEventListener("click", () => setView("inside"));
  panel.querySelector("#clear")?.addEventListener("click", () => select(null));
  panel.querySelectorAll("[data-up]").forEach(b => b.addEventListener("click", () => setView("context", b.dataset.up)));
  panel.querySelectorAll("[data-edge]").forEach(b => b.addEventListener("click", () => select({ type: "edge", id: b.dataset.edge })));
  panel.querySelectorAll("[data-flow]").forEach(b => b.addEventListener("click", () => select({ type: "flow", id: b.dataset.flow })));
}

function edgeLink(e) {
  const a = nodeById(e.from), b = nodeById(e.to);
  return `<li><button type="button" data-edge="${e.id}"><span class="k" style="background: var(--k-${e.kind})"></span><span><strong>${esc(e.label)}</strong> · ${esc(a.label)} ${e.both ? "⇄" : "→"} ${esc(b.label)}</span></button></li>`;
}

function renderLegend() {
  const lg = document.getElementById("legend");
  const dash = { rest: "", webhook: "7 4", auth: "2 4", data: "", nav: "10 4 2 4", ops: "4 3" };
  lg.innerHTML = Object.entries(KINDS).map(([k, label]) =>
    `<span><svg width="28" height="8" aria-hidden="true"><line x1="0" y1="4" x2="28" y2="4" stroke="var(--k-${k})" stroke-width="${k === "data" ? 2.6 : 2}" stroke-dasharray="${dash[k]}" stroke-linecap="${k === "auth" ? "round" : "butt"}"/></svg>${label}</span>`).join("");
}

document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));
document.getElementById("gtk").innerHTML = GOOD_TO_KNOW.map(g => `<li>${esc(g)}</li>`).join("");
renderLegend();
document.getElementById("tab-inside").textContent = `Inside ${SYSTEM_NAME}`;
let initial = "context";
try { if (location.hash === "#inside") initial = "inside"; } catch (_) {}
view = initial;
render();
</script>
